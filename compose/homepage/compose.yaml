services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      HOMEPAGE_ALLOWED_HOSTS: "localhost:3000,127.0.0.1:3000"

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./config:/app/config